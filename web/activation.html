<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>激活漫剧工坊</title><link rel="stylesheet" href="/activation.css"><script defer src="/activation.js"></script></head><body><main class="activation"><section class="identity"><span class="wordmark">漫剧工坊 <b>DESKTOP</b></span><div><span class="eyebrow">你的本地视频制作工作台</span><h1>让创作，<br>从这里开始。</h1><p>整理素材、修复字幕、制作封面，<br>在同一个工作空间完成。</p></div><small>素材与工程保存在本机 · 授权支持离线验证</small></section><section class="form-panel"><span class="step">首次使用 / 设备授权</span><h2>激活这台电脑</h2><p class="description">将机器码发送给软件提供方，获取专用于这台电脑的授权码。</p><label for="machine">本机机器码</label><div class="machine-row"><input id="machine" readonly aria-label="本机机器码"><button id="copy" type="button">复制</button></div><form id="activation-form"><label for="token">授权码</label><textarea id="token" required spellcheck="false" rows="5" placeholder="粘贴 MJ1 开头的完整授权码" aria-describedby="message"></textarea><p id="message" role="status" aria-live="polite"></p><button class="primary" id="activate" type="submit">激活并进入工作台 <span aria-hidden="true">→</span></button></form><div class="note">授权与当前 Windows 安装绑定。更换系统或系统盘后，请联系软件提供方重新授权。</div></section></main></body></html>
